os:
  editPreset: "nvim"
promptToReturnFromSubprocess: false
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
keybinding:
  commits:
    moveDownCommit: "J"
    moveUpCommit: "K"
    renameCommitWithEditor: "r"
    renameCommit: "R"
gui:
  scrollHeight: 20
  nerdFontsVersion: "3"
  skipRewordInEditorWarning: true
notARepository: "quit"

[helpers]

[default]
depends = []

[default.files]
# Development Tools
"nvim" = { target = "~/.config/nvim", type = "symbolic", recurse = false }
"git/gitconfig" = "~/.gitconfig"
"git/ignore" = "~/.config/git/ignore"
"lazygit/config.yml" = "~/.config/lazygit/config.yml"
"prettier/prettierrc" = "~/.prettierrc"
"editorconfig/editorconfig" = "~/.editorconfig"
# Terminal & Shell
"zsh/zshrc" = "~/.zshrc"
"zsh/zshenv" = "~/.zshenv"
"zsh/zprofile" = "~/.zprofile"
"ghostty/config" = "~/.config/ghostty/config"
"tmux/tmux.conf" = "~/.tmux.conf"
"atuin/config.toml" = "~/.config/atuin/config.toml"
# Window Management & macOS
"hammerspoon" = { target = "~/.hammerspoon", type = "symbolic", recurse = false }
"yabai/yabairc" = "~/.yabairc"
"skhd/skhdrc" = "~/.skhdrc"
"karabiner" = { target = "~/.config/karabiner", type = "symbolic", recurse = false }
"macOS/DefaultKeyBinding.dict" = "~/Library/KeyBindings/DefaultKeyBinding.dict"
# CLI Utilities
"glow/glow.yml" = "~/Library/Preferences/glow/glow.yml"
"ripgrep/ripgreprc" = "~/.ripgreprc"
"yazi/yazi.toml" = "~/.config/yazi/yazi.toml"
"mise/config.toml" = "~/.config/mise/config.toml"
"oyo/config.toml" = "~/.config/oyo/config.toml"
"mitmproxy/keys.yaml" = "~/.config/mitmproxy/keys.yaml"
"yt-dlp/config" = "~/.config/yt-dlp/config"
"tridactyl/tridactylrc" = "~/.config/tridactyl/tridactylrc"
# Browsers
"ardia/config.json" = "~/.config/ardia/config.json"
"ardia/hooks.json" = "~/.config/ardia/hooks.json"
"ardia/ardia-focus-tab" = "~/.local/bin/ardia-focus-tab"
"zen/zen-focus-tab" = "~/.local/bin/zen-focus-tab"
# Productivity Tools
"espanso" = { target = "~/.config/espanso", type = "symbolic", recurse = false }
# Custom Scripts
"scripts/focus-now-playing" = "~/.local/bin/focus-now-playing"
"scripts/yabai-apply-display-rules" = "~/.local/bin/yabai-apply-display-rules"
"scripts/update-packages" = "~/.local/bin/update-packages"
# LaunchAgents
"launchd/com.kevin.update-packages.plist" = "~/Library/LaunchAgents/com.kevin.update-packages.plist"

[default.variables]

[settings]
default_target_type = "symbolic"
recurse = false
